about.embedTitle=About Sus Detector
about.embedDesc=These days, many large public servers are plagued by spambots sending images or scam links in multiple channels. In an attempt to combat this, we at HyacinthBots, have created Sus Detector. Using Sus Detector, you can set a channel to detect when a message is sent in the channel, we recommend the oldest channel or a publicly visible channel at the top of the server list (as these are often the first channel targeted by the spambots). Sus Detector will automatically ban (and unban shortly after to allow them to rejoin if they recover their account) anyone who sends a message in the configured channel. Sus Detector also DMs the account to inform them and logs the action to guilds configured action log.
about.devInfo=Who makes Sus Detector
about.devInfoDesc=Sus Detector is developed by the HyacinthBots organisation. You can find out more about them [here](https://hyacinthbots.org)
