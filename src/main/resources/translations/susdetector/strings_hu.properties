about.embedTitle=Sus Detector-ról
about.embedDesc=Manapság számos nagy nyilvános szervert sújtják azok a spambotok, amelyek képeket vagy csaló linkeket küldenek több csatornára is. Ennek leküzdése érdekében mi, a HyacinthBots csapata, kifejlesztettük a Sus Detector alkalmazást. A Sus Detector segítségével beállíthatod, hogy egy csatorna észlelje, amikor üzenet érkezik a csatornára; javasoljuk a legrégebbi csatornát vagy a szerverlistán legelső helyen szereplő, nyilvánosan látható csatornát (mivel ezeket célozzák meg leggyakrabban a spambotok). A Sus Detector automatikusan letilt (majd röviddel később feloldja a tiltást, hogy a felhasználó visszatérhessen, ha helyreállítja fiókját) mindenkit, aki üzenetet küld a beállított csatornában. A Sus Detector emellett privát üzenetet is küld a fiók tulajdonosának, hogy értesítse őt, és naplózza a műveletet a beállított cselekvési naplóba.
